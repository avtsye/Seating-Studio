<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Seating Studio</title><link rel="stylesheet" href="src/styles.css"></head>
<body><div id="app">
<header class="topbar"><div><strong>Seating Studio</strong><small> מפת אולם ושיבוץ</small></div><nav><button class="active" data-mode="map">מפה</button><button data-mode="people">אנשים ושיבוץ</button><button data-mode="final">מפה סופית</button></nav></header>
<main><section class="workspace"><div class="toolbar"><button id="fit">התאם למסך</button><button id="zoomIn">＋</button><span id="zoomLabel">100%</span><button id="zoomOut">−</button><input id="search" placeholder="חיפוש אדם או מקום"></div>
<div id="viewport"><div id="canvas"></div></div></section>
<aside><h2>כלי מפה ושיבוץ</h2><div class="notice">זהו שלד הדור החדש. המפה נשארת אותה מפה בכל מצבי העבודה.</div><div class="stats"><div><b id="seatCount">0</b><span>מקומות</span></div><div><b id="assignedCount">0</b><span>משובצים</span></div></div><section id="selection"><h3>בחירה</h3><p>לחץ על מקום כדי לראות ולערוך אותו.</p></section><button class="primary" id="autoAssign">עבור לשיבוץ אוטומטי</button></aside>
</main></div><script type="module" src="src/app.js"></script></body></html>
