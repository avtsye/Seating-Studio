name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: seating-studio-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: node --check src/app.js
      - run: node tests/test_assignment_priority.mjs
      - run: node tests/test_assignment_store.mjs
      - run: node tests/test_workspace.mjs
      - run: node tests/test_seat_overlays.mjs
      - run: node tests/test_hall_layout.mjs
      - run: node tests/test_file_formats.mjs
      - run: node tests/test_export_packages.mjs
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build single HTML
        run: python scripts/build_single_html.py
      - name: Validate single HTML
        run: |
          test -s dist/Seating-Studio-Offline.html
          ! grep -q 'src/styles.css' dist/Seating-Studio-Offline.html
          ! grep -q 'src/app.js' dist/Seating-Studio-Offline.html
          # External runtime assets would break true offline use.
          ! grep -Eiq '<(script|link|img)[^>]+(src|href)="https?://' dist/Seating-Studio-Offline.html
      - name: Install Playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Browser smoke tests
        run: |
          python run.py --port 8000 > /tmp/seating-studio-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node tests/browser_smoke.mjs
      - name: Upload single HTML
        uses: actions/upload-artifact@v4
        with:
          name: Seating-Studio-Offline
          path: dist/Seating-Studio-Offline.html
          if-no-files-found: error

  windows-exe:
    name: Build lightweight Windows EXE
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build offline HTML
        run: python scripts/build_single_html.py
      - name: Publish lightweight WebView2 EXE
        shell: pwsh
        run: |
          dotnet restore windows/SeatingStudio.Win/SeatingStudio.Win.csproj
          dotnet publish windows/SeatingStudio.Win/SeatingStudio.Win.csproj -c Release -r win-x64 --self-contained false -o dist-windows -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false
          if (-not (Test-Path "dist-windows/Seating-Studio.exe")) {
            throw "Seating-Studio.exe was not created"
          }
          Get-Item "dist-windows/Seating-Studio.exe" | Format-List Name,Length,FullName
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Seating-Studio-Windows-EXE
          path: dist-windows/Seating-Studio.exe
          if-no-files-found: error
