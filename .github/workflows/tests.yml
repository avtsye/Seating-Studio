name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: seating-studio-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: node --check src/app.js
      - run: node tests/test_assignment_priority.mjs
      - run: node tests/test_assignment_store.mjs
      - run: node tests/test_workspace.mjs
      - run: node tests/test_seat_overlays.mjs
      - run: node tests/test_hall_layout.mjs
      - run: node tests/test_file_formats.mjs
      - run: node tests/test_export_packages.mjs
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build single HTML
        run: python scripts/build_single_html.py
      - name: Validate single HTML
        run: |
          test -s dist/Seating-Studio-Offline.html
          ! grep -q 'src/styles.css' dist/Seating-Studio-Offline.html
          ! grep -q 'src/app.js' dist/Seating-Studio-Offline.html
          # External runtime assets would break true offline use.
          ! grep -Eiq '<(script|link|img)[^>]+(src|href)="https?://' dist/Seating-Studio-Offline.html
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: |
          python run.py --port 8000 > /tmp/seating-studio-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node tests/browser_smoke.mjs
      - name: Upload single HTML
        uses: actions/upload-artifact@v4
        with:
          name: Seating-Studio-Offline
          path: dist/Seating-Studio-Offline.html
          if-no-files-found: error
